name: Publish to crates.io

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., v0.1.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  # No test/fmt/clippy re-run here (#489): the PR release gates (ci.yml) already
  # tested the merged tree before this tag's commit landed on `main` — re-running
  # the full suite at deploy time is redundant and an added flake-exposure surface
  # (this exact pattern blocked a release — #488). Deploy = build + package + publish.
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Read the pinned rue version
        id: rue
        run: echo "version=$(tr -d '[:space:]' < puzzles/RUE_VERSION)" >> "$GITHUB_OUTPUT"

      # Pinned (#9): an unpinned installer resolved the LATEST rue at job runtime,
      # so the compiled artifacts were a function of the calendar rather than of a
      # reviewed file.
      - name: Install rue compiler (SETUP-005, pinned)
        uses: taiki-e/install-action@v2
        with:
          tool: rue-cli@${{ steps.rue.outputs.version }}

      - name: Assert rue is actually on PATH
        # Not silently trusted: without a compiler, build.rs skips verification
        # and every check below this line goes vacuous.
        run: command -v rue

      # Force the build script to run even on a warm cache. Cargo does not re-run
      # a build script merely because a program appeared on PATH, and a replayed
      # "rue not found" result would make the verification below meaningless.
      - name: Discard any cached build-script result
        run: cargo clean -p chia-l2-consensus

      - name: Verify package can be built
        run: cargo build --release

      # The published tree MUST equal the commit. `build.rs` no longer writes into
      # the source tree, so this diff is expected to be empty; it is asserted
      # anyway, before packaging, so that a regression names its own cause instead
      # of surfacing as a generic cargo error (or, as it did for 0.3.0 and 0.4.0
      # under `--allow-dirty`, as nothing at all).
      - name: Assert the compiled puzzle artifacts match the commit
        run: |
          git diff --exit-code -- puzzles/compiled/ || {
            echo "::error::puzzles/compiled/ differs from the commit. These artifacts are"
            echo "::error::embedded via include_str! and are the shipped consensus rule;"
            echo "::error::publishing a regenerated tree would ship bytes nobody reviewed."
            exit 1
          }

      - name: Verify package can be packaged
        run: cargo package

      - name: Check if CARGO_REGISTRY_TOKEN is available
        run: |
          if [ -z "${{ secrets.CARGO_REGISTRY_TOKEN }}" ]; then
            echo "CARGO_REGISTRY_TOKEN secret is not set in repository settings"
            exit 1
          fi

      - name: Publish to crates.io
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: extract_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: "chia-l2-consensus v${{ steps.extract_version.outputs.VERSION }}"
          body: |
            ## chia-l2-consensus v${{ steps.extract_version.outputs.VERSION }}

            Groth16-based L2 validator consensus for Chia — proves majority validator agreement to L1 at constant cost using zero-knowledge proofs.

            ### Installation
            ```toml
            [dependencies]
            chia-l2-consensus = "${{ steps.extract_version.outputs.VERSION }}"
            ```
          draft: false
          prerelease: false
