[package]
name        = "chia-l2-consensus"
version     = "0.5.0"
edition     = "2021"
description = "Groth16-based L2 validator consensus for Chia — proves majority validator agreement to L1 at constant cost using zero-knowledge proofs"
license     = "Apache-2.0 OR MIT"
repository  = "https://github.com/DIG-Network/chia-l2-consensus"
readme      = "README.md"

[dependencies]
# Chia — versions aligned with chia-wallet-sdk 0.34's internal chain
# (chia-* v0.36 / chia-puzzles v0.20 / clvmr v0.16) to avoid type
# incompatibilities between this crate and the SDK test infrastructure.
#
# chia-puzzles v0.20 carries only the compiled puzzles and their hashes; the
# Rust argument/solution types it used to hold now live in chia-puzzle-types.
#
# This crate re-exports chia_protocol::{Bytes32, SpendBundle} from its root, so
# the chia-protocol major move is visible in the public API (hence 0.4.0).
chia-wallet-sdk   = "0.34"
chia-protocol     = "0.36"
chia-puzzles      = "0.20"
chia-puzzle-types = "0.36"
chia-bls          = "0.36"
clvm-traits       = "0.36"
clvm-utils        = "0.36"  # curry_tree_hash, tree_hash (used by indexer lineage check)
clvmr             = "0.16"

# ZK proving (→ see spec-groth16-circuit — Dependencies)
ark-groth16           = "0.4"
ark-bls12-381         = "0.4"
ark-r1cs-std          = "0.4"
ark-relations         = "0.4"
ark-ff                = "0.4"
ark-ec                = "0.4"
ark-std               = "0.4"
ark-serialize         = "0.4"
ark-crypto-primitives = { version = "0.4", features = ["crh", "r1cs"] }

# BLS aggregation off-chain (→ see spec-wire-format — Aggregate Signature)
blst = "0.3"

# Async
tokio   = { version = "1", features = ["full"] }
futures = "0.3"

# Serialization
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
hex          = "0.4"
num-bigint   = "0.4"

# Error handling
thiserror = "1"
anyhow    = "1"

sha2 = "0.10"

# Blockchain queries (RPC-001) — decentralized peers + coinset.org fallback
chia-query = "0.12"

# Wallet integration (RPC-005) — coin selection for collateral funding.
# Engine-only seam: this crate never signs, so it never links the client-seam signer
# (dig-wallet-backend SPEC §1.3 — an engine consumer depends with default-features off).
dig-wallet-backend = { version = "0.27", default-features = false, features = ["engine"] }

# Chia SDK — wallet operations, spend bundles, singleton handling
chia-sdk-driver = "0.34"   # SpendContext, StandardLayer, Launcher

[dev-dependencies]
tokio          = { version = "1", features = ["full"] }
rand           = "0.8"
chia-sdk-test     = "0.34"  # Simulator, test_secret_key, sign_transaction
chia-sdk-types    = "0.34"  # Conditions
chia-puzzle-types = "0.36"  # SingletonArgs/Solution/Struct, Proof (aligned with SDK)
clvm-utils        = "0.36"  # CurriedProgram, tree_hash (aligned with SDK)

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
